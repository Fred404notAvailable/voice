services:
  ml:
    build: ./services/ml
    ports: ["8000:8000"]
    environment:
      - MOCK_ML=0
    volumes:
      - ./services/ml/artifacts:/app/artifacts:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      retries: 6

  gateway:
    build: ./services/gateway
    ports: ["8080:8080"]
    environment:
      - ML_WS_URL=ws://ml:8000/ws/session
      - ML_HTTP_URL=http://ml:8000
      - CORS_ORIGIN=*
      - PORT=8080
    depends_on:
      ml:
        condition: service_healthy

  web:
    build: ./apps/web
    ports: ["5180:80", "5173:80"]
    depends_on:
      - gateway
